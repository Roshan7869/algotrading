# MiroShark Signal Bus Cron Jobs
# Runs from the project venv Python
SHELL=/bin/bash
PATH=/home/roshan/Downloads/Algotrading/.venv/bin:/usr/local/bin:/usr/bin:/bin

# Regime refresh — every 5 minutes
*/5 * * * * cd /home/roshan/Downloads/Algotrading && .venv/bin/python3 scripts/refresh_regime.py >> logs/regime_cron.log 2>&1

# TradingAgents signal — every 15 minutes
*/15 * * * * cd /home/roshan/Downloads/Algotrading && .venv/bin/python3 scripts/refresh_agents.py >> logs/agents_cron.log 2>&1

# News sentiment refresh — every 30 minutes
*/30 * * * * cd /home/roshan/Downloads/Algotrading && .venv/bin/python3 scripts/refresh_sentiment.py >> logs/sentiment_cron.log 2>&1

# Outcome feedback refresh — every hour
0 * * * * cd /home/roshan/Downloads/Algotrading && .venv/bin/python3 scripts/refresh_outcomes.py >> logs/outcomes_cron.log 2>&1
